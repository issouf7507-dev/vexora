  <circle cx="186" cy="285" r="338" fill="#3a1a06" opacity="0.27"/><circle cx="157" cy="663" r="422" fill="#3a1a06" opacity="0.20"/><circle cx="701" cy="130" r="280" fill="#141210" opacity="0.13"/><circle cx="890" cy="190" r="401" fill="#3a1a06" opacity="0.19"/><circle cx="2" cy="598" r="350" fill="#3a1a06" opacity="0.19"/>
  <circle cx="300" cy="275" r="340" fill="#ff6400" opacity="0.16" filter="url(#blur)"/>
  <rect width="1000" height="1100" fill="url(#l)"/>
