      <stop offset="0%" stop-color="#3a1a06"/>
      <stop offset="45%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141210" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.9"/>
