<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <defs>
    <radialGradient id="g" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#ff7000"/>
      <stop offset="45%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#121212"/>
    </radialGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="180"/>
    </filter>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="42"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1000" height="1200" fill="url(#g)"/>
  <circle cx="962" cy="935" r="166" fill="#ff7000" opacity="0.23"/><circle cx="922" cy="318" r="391" fill="#1c1c1c" opacity="0.25"/><circle cx="887" cy="710" r="160" fill="#1c1c1c" opacity="0.13"/><circle cx="879" cy="63" r="157" fill="#ff7000" opacity="0.28"/><circle cx="615" cy="917" r="270" fill="#1c1c1c" opacity="0.21"/>
  <circle cx="300" cy="300" r="340" fill="#ff6400" opacity="0.16" filter="url(#blur)"/>
  <rect width="1000" height="1200" fill="url(#l)"/>
  <rect width="1000" height="1200" filter="url(#n)" opacity="0.5"/>
</svg>