<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <defs>
    <radialGradient id="g" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#ff9c5c"/>
      <stop offset="45%" stop-color="#c24000"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c24000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="180"/>
    </filter>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="55"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1000" height="1200" fill="url(#g)"/>
  <circle cx="45" cy="1025" r="414" fill="#ff9c5c" opacity="0.20"/><circle cx="732" cy="759" r="437" fill="#ff9c5c" opacity="0.27"/><circle cx="709" cy="358" r="377" fill="#ff9c5c" opacity="0.23"/><circle cx="794" cy="1082" r="209" fill="#ff9c5c" opacity="0.17"/><circle cx="19" cy="1173" r="250" fill="#c24000" opacity="0.13"/>
  <circle cx="300" cy="300" r="340" fill="#ff6400" opacity="0.16" filter="url(#blur)"/>
  <rect width="1000" height="1200" fill="url(#l)"/>
  <rect width="1000" height="1200" filter="url(#n)" opacity="0.5"/>
</svg>