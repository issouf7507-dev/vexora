  <rect width="1000" height="1200" fill="url(#g)"/>
  <circle cx="795" cy="756" r="270" fill="#ff6400" opacity="0.29"/><circle cx="304" cy="635" r="299" fill="#ff7f2a" opacity="0.19"/><circle cx="243" cy="213" r="325" fill="#ff7f2a" opacity="0.30"/><circle cx="49" cy="424" r="353" fill="#ff6400" opacity="0.13"/><circle cx="806" cy="407" r="310" fill="#ff7f2a" opacity="0.19"/>
  <circle cx="300" cy="300" r="340" fill="#ff6400" opacity="0.16" filter="url(#blur)"/>
  <rect width="1000" height="1200" fill="url(#l)"/>
  <rect width="1000" height="1200" filter="url(#n)" opacity="0.5"/>
