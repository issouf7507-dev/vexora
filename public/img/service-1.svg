<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <defs>
    <radialGradient id="g" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#ff9c5c"/>
      <stop offset="45%" stop-color="#8f3300"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f3300" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="180"/>
