  <rect width="1000" height="1200" fill="url(#g)"/>
  <circle cx="712" cy="667" r="323" fill="#8f3300" opacity="0.14"/><circle cx="494" cy="194" r="253" fill="#8f3300" opacity="0.17"/><circle cx="420" cy="565" r="408" fill="#ff9c5c" opacity="0.20"/><circle cx="134" cy="604" r="300" fill="#8f3300" opacity="0.23"/><circle cx="401" cy="151" r="330" fill="#ff9c5c" opacity="0.27"/>
  <circle cx="300" cy="300" r="340" fill="#ff6400" opacity="0.16" filter="url(#blur)"/>
  <rect width="1000" height="1200" fill="url(#l)"/>
  <rect width="1000" height="1200" filter="url(#n)" opacity="0.5"/>
